[package]
name = "waku-core"
version = "0.1.0"
edition = "2024"
description = "Headless provider, persistence, and workspace runtime for Waku"
license = "GPL-3.0-only"
readme = "README.md"

[features]
# `tracing` spans around event fan-out, request dispatch and task-state saves.
# Off by default, and without it every span compiles to nothing.
profiling = ["dep:tracing"]

[dependencies]
agent-client-protocol = "2.0.0"
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
dirs = "6.0"
nucleo-matcher = "0.3"
parking_lot = "0.12"
rust-i18n = "4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
serde_json = "1.0"
# Content revisions and blob digests of protocol v8 (RFC 0003).
sha2 = "0.10"
smol = "2"
subtle = "2"
toml = "0.8"
tracing = { version = "0.1", optional = true }
trash = "5.2.6"
# The socket layer is evented (#18): a small multi-thread runtime owns accept,
# per-connection reader and writer tasks and the keepalive timers, while
# backend requests run on its blocking pool. RFC 0002 moves the drivers onto
# the same runtime later.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
waku-protocol = { path = "../waku-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# The daemon terminal's output thread blocks on PTY readiness instead of
# sleeping between reads (#178). Already in the tree through alacritty.
polling = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSLocale",
    "NSString",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
waku-client = { path = "../waku-client" }

[lints]
workspace = true

[[bench]]
name = "persistence"
harness = false
