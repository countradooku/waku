[package]
name = "waku-protocol"
version = "0.1.0"
edition = "2024"
description = "Versioned, transport-neutral wire contract shared by Waku clients and daemon"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
# Protocol v8 (RFC 0003): MessagePack with named fields for native frames.
rmp = "0.8"
rmp-serde = "1.3"
rust-i18n = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# JSON Schema export of the v8 wire types (RFC 0003 §9). Only the `schema`
# feature builds it (`waku-codegen`), so the app and daemon never do.
schemars = { version = "1", optional = true, features = ["uuid1"] }
similar = "3"
uuid = { version = "1.18", features = ["v4", "serde"] }

[features]
# `schemars::JsonSchema` derives on the v8 wire types, for `waku-codegen`.
schema = ["dep:schemars"]

[target.'cfg(unix)'.dependencies]
# `geteuid` for the per-user socket path fallback (identity.rs).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSLocale",
    "NSString",
] }

[lints]
workspace = true
