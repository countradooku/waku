[package]
name = "waku-daemon"
version = "0.1.0"
edition = "2024"
description = "Headless Waku provider daemon"
license = "GPL-3.0-only"
readme = "README.md"

[features]
dev-binary = []
# Install a `tracing-tracy` subscriber and turn on waku-core's spans. See
# docs/performance.md.
profiling = ["waku-core/profiling", "dep:tracing", "dep:tracing-subscriber", "dep:tracing-tracy"]

[[bin]]
name = "waku-daemon"
path = "src/main.rs"

[[bin]]
name = "waku-debug-daemon"
path = "src/bin/waku-debug-daemon.rs"
required-features = ["dev-binary"]

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "fmt",
    "registry",
] }
tracing-tracy = { version = "0.12", optional = true, default-features = false, features = [
    "enable",
    "ondemand",
    "broadcast",
    "only-localhost",
] }
waku-core = { path = "../waku-core" }
waku-protocol = { path = "../waku-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[lints]
workspace = true
