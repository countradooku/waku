[package]
name = "waku-client"
version = "0.1.0"
edition = "2024"
description = "Rust client and daemon process supervisor for Waku"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
dirs = "6.0"
parking_lot = "0.12"
nucleo-matcher = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
# The connection thread runs a current-thread tokio runtime (#18) so reads,
# writes and keepalive are evented instead of polled. The public API stays
# synchronous and runtime-agnostic: callers block on crossbeam channels.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
waku-protocol = { path = "../waku-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
